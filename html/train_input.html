<button type="download" id="selectDirBtn" name="download">choose npz download path</button>
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
      <h3>determine your downloading catalog</h3>

     </div>
   </div>
   
   
   <script>
    const selectDirBtn = document.getElementById('selectDirBtn');
    const confirmModal = document.getElementById('confirmModal');
    const dirNameEl = document.getElementById('dirName');
    const confirmBtn = document.getElementById('confirmBtn');
    const cancelBtn = document.getElementById('cancelBtn');
   
   
            // 弹出输入框让用户输入保存路径
      selectDirBtn.addEventListener('click', async () => {
      try {
        const [dirHandle] = await window.showDirectoryPicker({ mode: 'readwrite' });
        selectedDirHandle = dirHandle;
        dirNameEl.textContent=dirHandle.name;
        confirmModal.style.display = 'flex'; // 显示自定义弹窗
      } catch (error) {
        if (error.name !== 'AbortError') {
          console.error('目录选择出错：', error);
        }
      }
    
    });
   // ensure the downloading catalog
    confirmBtn.addEventListener('click', () => {
      confirmModal.style.display = 'none';
      console.log('user have checked the download catalog:', selectedDirHandle.name);
      // TODO: 执行下载逻辑
      if (dirNameEl!=null){
         const form = document.createElement('form');
              form.method = 'POST';
              form.action = '/download';
          const savePathInput=document.createElementInput('input')
          savePathInput.type='hidden'
          savePathInput.name=dirNameEl
          document.body.appendChild(form);
          form.submit();
          document.body.removeChild(form);
      }
    });

    // cancal the downloading
    cancelBtn.addEventListener('click', () =>{
      confirmModal.style.display = 'none';
      console.log('user cancel the downloading.');
      // 可选：返回上一页 history.back();
    });
   
    </script>
