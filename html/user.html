<body>
  <style>
  .preview-container {
            display: none; /* 默认隐藏 */

            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(220,220,220,0.2); /* 黑色半透明背景 */
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */

            max-width: 100%;

        }

   .close {

        }
    .fileupload{

<div class="form_container">

 </form>
 </div>
